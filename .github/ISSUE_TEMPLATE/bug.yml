name: Bug
description: Report a reproducible software or hardware-integration problem.
title: "fix: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the command, configuration, and steps needed to reproduce it.
    validations:
      required: true
  - type: dropdown
    id: validation
    attributes:
      label: Environment
      options:
        - CI or simulated hardware
        - Raspberry Pi
        - Bench hardware
        - Integrated payload hardware
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove credentials and private telemetry before posting.
