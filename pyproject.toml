[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "balloon4-flight-computer"
version = "2.0.0"
description = "Fault-tolerant Raspberry Pi data acquisition for the Balloon4 high-altitude balloon project."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
hardware = [
  "adafruit-blinka",
  "adafruit-circuitpython-bme680",
  "adafruit-circuitpython-bno08x",
  "adafruit-circuitpython-gps",
  "adafruit-circuitpython-mcp9808",
  "adafruit-circuitpython-rfm9x",
  "pyserial",
  "RPi.GPIO",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
balloon4 = "balloon4.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
